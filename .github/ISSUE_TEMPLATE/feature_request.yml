name: 功能需求
description: 提交用户故事、范围和可验证的验收标准
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景与用户故事
      placeholder: 作为……，我希望……，以便……。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 需求范围
      description: 描述需要交付的行为、边界和不在本次范围内的事项。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准（Given / When / Then）
      description: 每个场景都应可由测试人员独立验证，包含失败或降级路径。
      placeholder: |
        场景：……
        Given（前置条件）：……
        When（执行操作）：……
        Then（预期结果）：……
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与影响
      description: 可选方案、设备或 root 方案限制，以及兼容性影响。
